name: Intrusion Grid — play a move

# Every cell on the board is a link that opens a pre-filled issue titled
# "move: <cell>" (or "game: new" from the reset link). This workflow is the
# other half of that loop: it reads the title, plays the move, comments the
# result, closes the issue, and commits the updated board back to the README.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: intrusion-grid
  cancel-in-progress: false

jobs:
  play:
    if: >
      startsWith(github.event.issue.title, 'move: ') ||
      github.event.issue.title == 'game: new'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move
        id: play
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          if [ "$TITLE" = "game: new" ]; then
            result="$(python game/engine.py new)"
          else
            cell="${TITLE#move: }"
            result="$(python game/engine.py move "$cell" --actor "$ACTOR")"
          fi
          {
            echo "result<<GRID_EOF"
            echo "$result"
            echo "GRID_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated board
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json

          if git diff --cached --quiet; then
            echo "Board unchanged — nothing to commit."
          else
            git commit -m "game: ${{ github.event.issue.title }} (via #${{ github.event.issue.number }})"
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              echo "Push rejected (attempt ${attempt}); rebasing on origin."
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: Reply and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.play.outputs.result }}\n\n[**View the board →**](https://github.com/${{ github.repository }}#readme)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      # Committing README.md is not enough on its own — GitHub proxies README
      # images and caches them, so the updated board would not show up on the
      # profile immediately even though the file is already correct.
      - name: Refresh profile image cache
        run: |
          chmod +x scripts/purge-camo.sh
          ./scripts/purge-camo.sh "${{ github.repository_owner }}"

      - name: Reject an unrecognized move
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Couldn't parse that move — please use the links on the profile board rather than editing the issue title by hand.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
